name: CI

on:
  push:
    branches: [main, dev, overhaul-v14]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Offline smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is what the installed DisTube requires; 24.x is current LTS+1.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The smoke test only loads modules and exercises pure logic, so the
      # postinstall binary downloads (yt-dlp, static ffmpeg) are skipped to keep
      # CI fast and offline-ish.
      - run: npm ci --ignore-scripts

      - run: npm test
